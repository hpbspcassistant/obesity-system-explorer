name: Verify and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obesity-system-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: obesity-system-map/.nvmrc
          cache: npm
          cache-dependency-path: obesity-system-map/package-lock.json
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: obesity-system-map-dist
          path: obesity-system-map/dist
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag obesity-system-map:ci obesity-system-map
